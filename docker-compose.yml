# Root-level production stack for enstorage.
#
# Defines ALL services inline (no `include:` from backend/docker-compose.yml)
# so the prod stack (project `enstorage-prod`) can co-exist on this host with
# the dev stack (project `enstorage`) defined in backend/docker-compose.yml.
# Using `include:` deep-merges list keys (e.g. `ports`) which made per-service
# port overrides impossible without rewriting the include source.
#
# Co-existence rules:
#   * Every prod container is named `enstorage-prod-*` and alias-published on
#     its networks so internal DNS resolves `app`, `postgres`, `redis` etc.
#     for nginx fastcgi_pass and Reverb/worker wiring without colliding on
#     the host's container-name namespace.
#   * Reverb prod host port is 8084 (dev reverb holds 8083).
#   * Prod nginx debug port is 8085 (dev nginx holds 8082; 8083 is dev
#     reverb; 8084 is prod reverb).
#   * Prod web publishes 3001:3000 (debug fallback only; production traffic
#     flows through NPM over the external `web-network`).
#   * Both stacks attach to the external `web-network` so Nginx Proxy Manager
#     can resolve `app`, `web`, `reverb` by name for HTTPS / WSS.
#
# Required external resources on the host (one-time setup):
#   docker network create web-network
#
# Usage on the VPS:
#   docker compose -f docker-compose.yml up -d

name: enstorage-prod

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: enstorage-app
    container_name: enstorage-prod-app
    # `app` alias lets nginx fastcgi_pass `app:9000` work without changing
    # the upstream nginx config — and without claiming the bare `app`
    # container_name that the dev stack already owns.
    networks:
      enstorage-net:
        aliases:
          - app
      web-network:
        aliases:
          - app
    working_dir: /var/www/html
    volumes:
      - ./backend/storage/app/firebase-service-account.json:/var/www/html/storage/app/firebase-service-account.json:ro
      # The actual Laravel env file lives in backend/.env (gitignored).
      # Mounting `./.env` (an empty directory at the repo root on this
      # host) produced a directory at /var/www/html/.env inside the
      # container — Laravel then silently fell back to default config
      # and Reverb had no APP_KEY/SECRET, so WS auth failed.
      - ./backend/.env:/var/www/html/.env:ro
      - app-storage:/var/www/html/storage
      - app-bootstrap-cache:/var/www/html/bootstrap/cache
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: enstorage
      DB_USERNAME: enstorage
      DB_PASSWORD: ${DB_PASSWORD:-enstorage}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      APP_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: enstorage-prod-nginx
    networks:
      enstorage-net:
        aliases:
          - nginx
      web-network:
        aliases:
          - nginx
    ports:
      # 8085 host → 80 container. Dev nginx holds 8082; this is debug only.
      - "8085:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: docker/worker.Dockerfile
    image: enstorage-worker
    container_name: enstorage-prod-worker
    networks:
      enstorage-net:
        aliases:
          - worker
      web-network:
        aliases:
          - worker
    working_dir: /var/www/html
    volumes:
      - app-storage:/var/www/html/storage
      - ./backend/storage/app/firebase-service-account.json:/var/www/html/storage/app/firebase-service-account.json:ro
      - ./backend/.env:/var/www/html/.env:ro
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: enstorage
      DB_USERNAME: enstorage
      DB_PASSWORD: ${DB_PASSWORD:-enstorage}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      APP_ENV: production
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: enstorage-prod-postgres
    networks:
      enstorage-net:
        aliases:
          - postgres
    environment:
      POSTGRES_DB: enstorage
      POSTGRES_USER: enstorage
      POSTGRES_PASSWORD: ${DB_PASSWORD:-enstorage}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enstorage -d enstorage"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: enstorage-prod-redis
    networks:
      enstorage-net:
        aliases:
          - redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  reverb:
    build:
      context: ./backend
      dockerfile: docker/reverb.Dockerfile
    image: enstorage-reverb
    container_name: enstorage-prod-reverb
    networks:
      enstorage-net:
        aliases:
          - reverb
      web-network:
        aliases:
          - reverb
    working_dir: /var/www/html
    volumes:
      - ./backend/.env:/var/www/html/.env:ro
    environment:
      APP_ENV: production
    ports:
      # Host 8084 → container 8080. Dev reverb holds 8083.
      # Production WSS flows through NPM over web-network on container
      # port 8080; this host mapping is a debug fallback only.
      - "8084:8080"
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* are baked into the JS bundle at build time,
      # so they must be passed as build args (not just runtime env).
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-https://api-enstorage.enpiistudio.com/api/v1}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_REVERB_SCHEME: ${NEXT_PUBLIC_REVERB_SCHEME:-wss}
        NEXT_PUBLIC_REVERB_HOST: ${NEXT_PUBLIC_REVERB_HOST:-enstorage.enpiistudio.com}
        NEXT_PUBLIC_REVERB_PORT: ${NEXT_PUBLIC_REVERB_PORT:-443}
        NEXT_PUBLIC_REVERB_APP_KEY: ${NEXT_PUBLIC_REVERB_APP_KEY:-}
    image: enstorage-web:latest
    container_name: enstorage-prod-web
    # `web` alias on web-network so NPM (and any tooling that hardcodes
    # the bare name `web`) can still resolve the prod frontend.
    networks:
      web-network:
        aliases:
          - web
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-https://api-enstorage.enpiistudio.com/api/v1}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      NEXT_PUBLIC_REVERB_SCHEME: ${NEXT_PUBLIC_REVERB_SCHEME:-wss}
      NEXT_PUBLIC_REVERB_HOST: ${NEXT_PUBLIC_REVERB_HOST:-enstorage.enpiistudio.com}
      NEXT_PUBLIC_REVERB_PORT: ${NEXT_PUBLIC_REVERB_PORT:-443}
      NEXT_PUBLIC_REVERB_APP_KEY: ${NEXT_PUBLIC_REVERB_APP_KEY:-}
    depends_on:
      - app
    ports:
      - "3001:3000"
    restart: unless-stopped

volumes:
  app-storage:
  app-bootstrap-cache:
  postgres-data:
  redis-data:

networks:
  enstorage-net:
    driver: bridge
  web-network:
    external: true