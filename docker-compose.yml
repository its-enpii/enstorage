# Production stack for enstorage. This is the ONLY compose stack on the VPS
# (no separate dev stack — development is done on a local workstation).
#
# Architecture:
#   * Backend (Laravel + Postgres + Redis + Nginx + worker + Reverb) + Web
#     (Next.js) — all services defined inline here.
#   * `app`/`web`/`nginx`/`reverb` attach to the external `web-network` so
#     Nginx Proxy Manager (running on the host, NOT in a container) can
#     resolve them by bare hostname and terminate TLS / WSS.
#   * `postgres` and `redis` stay on the internal `enstorage-net` only.
#
# Required external resources on the host (one-time setup):
#   docker network create web-network
#
# Required file on host (operator-managed, NOT in repo):
#   backend/.env — Laravel secrets (APP_KEY, DB_PASSWORD, REVERB_*,
#                  GOOGLE_*, BROADCAST_CONNECTION, ...)
#   .env         — frontend-only NEXT_PUBLIC_* (compose auto-loads)
#
# Usage on the VPS:
#   docker compose up -d --build

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: enstorage-app
    container_name: enstorage-app
    working_dir: /var/www/html
    volumes:
      - ./backend/storage/app/firebase-service-account.json:/var/www/html/storage/app/firebase-service-account.json:ro
      - ./backend/.env:/var/www/html/.env:ro
      - app-storage:/var/www/html/storage
      - app-bootstrap-cache:/var/www/html/bootstrap/cache
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: enstorage
      DB_USERNAME: enstorage
      DB_PASSWORD: ${DB_PASSWORD:-enstorage}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      APP_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - enstorage-net
      - web-network
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: enstorage-nginx
    ports:
      # Host 8008 → container 80. Host 8080 is held by another project's
      # nginx on this VPS (`encenter-evolution`), so the debug port
      # mapping was bumped here. Production traffic flows through NPM
      # over web-network (container port 80); this host mapping is a
      # debug fallback only.
      - "8008:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - enstorage-net
      - web-network
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: docker/worker.Dockerfile
    image: enstorage-worker
    container_name: enstorage-worker
    working_dir: /var/www/html
    volumes:
      - app-storage:/var/www/html/storage
      - ./backend/storage/app/firebase-service-account.json:/var/www/html/storage/app/firebase-service-account.json:ro
      - ./backend/.env:/var/www/html/.env:ro
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: enstorage
      DB_USERNAME: enstorage
      DB_PASSWORD: ${DB_PASSWORD:-enstorage}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      APP_ENV: production
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - enstorage-net
      - web-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: enstorage-postgres
    environment:
      POSTGRES_DB: enstorage
      POSTGRES_USER: enstorage
      POSTGRES_PASSWORD: ${DB_PASSWORD:-enstorage}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enstorage -d enstorage"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - enstorage-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: enstorage-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - enstorage-net
    restart: unless-stopped

  reverb:
    build:
      context: ./backend
      dockerfile: docker/reverb.Dockerfile
    image: enstorage-reverb
    container_name: enstorage-reverb
    working_dir: /var/www/html
    volumes:
      - ./backend/.env:/var/www/html/.env:ro
    environment:
      APP_ENV: production
    ports:
      # Host 8083 → container 8080. Production WSS flows through NPM
      # over web-network (container port 8080); this host mapping is a
      # debug fallback only.
      - "8083:8080"
    networks:
      - enstorage-net
      - web-network
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* are baked into the JS bundle at build time,
      # so they must be passed as build args (not just runtime env).
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-https://api-enstorage.enpiistudio.com/api/v1}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_REVERB_SCHEME: ${NEXT_PUBLIC_REVERB_SCHEME:-wss}
        NEXT_PUBLIC_REVERB_HOST: ${NEXT_PUBLIC_REVERB_HOST:-enstorage.enpiistudio.com}
        NEXT_PUBLIC_REVERB_PORT: ${NEXT_PUBLIC_REVERB_PORT:-443}
        NEXT_PUBLIC_REVERB_APP_KEY: ${NEXT_PUBLIC_REVERB_APP_KEY:-}
    image: enstorage-web:latest
    container_name: enstorage-web
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-https://api-enstorage.enpiistudio.com/api/v1}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      NEXT_PUBLIC_REVERB_SCHEME: ${NEXT_PUBLIC_REVERB_SCHEME:-wss}
      NEXT_PUBLIC_REVERB_HOST: ${NEXT_PUBLIC_REVERB_HOST:-enstorage.enpiistudio.com}
      NEXT_PUBLIC_REVERB_PORT: ${NEXT_PUBLIC_REVERB_PORT:-443}
      NEXT_PUBLIC_REVERB_APP_KEY: ${NEXT_PUBLIC_REVERB_APP_KEY:-}
    depends_on:
      - app
    ports:
      # Host 3000 → container 3000. NPM forwards the public domain to
      # `web:3000` over web-network; this host mapping is a debug
      # fallback only.
      - "3000:3000"
    networks:
      - web-network
    restart: unless-stopped

volumes:
  app-storage:
  app-bootstrap-cache:
  postgres-data:
  redis-data:

networks:
  enstorage-net:
    driver: bridge
  web-network:
    external: true