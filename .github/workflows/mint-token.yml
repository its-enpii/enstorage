name: Mint Token
on:
  workflow_dispatch:
jobs:
  m:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 10m
          script: |
            cd //home/enpii/studio/enstorage
            docker compose -f docker-compose.yml exec -T app php artisan tinker --execute='
              $fid = "01a0e68d-160e-708f-90f9-d634f9808fcc";
              $u = App\Models\User::find(DB::table("folders")->where("id",$fid)->value("user_id"));
              $u->tokens()->where("name","ui-verify4")->delete();
              echo "TOKEN=", $u->createToken("ui-verify4")->plainTextToken, PHP_EOL;
            '
