name: Mint Token
on:
  workflow_dispatch:
jobs:
  m:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 10m
          script: |
            cd //home/enpii/studio/enstorage
            docker compose -f docker-compose.yml exec -T app php artisan tinker --execute='
              $u = App\Models\User::where("email","enpiiofficial@gmail.com")->first() ?? App\Models\User::first();
              $u->tokens()->where("name","ui-verify")->delete();
              echo "OWNER=", $u->email, PHP_EOL;
              echo "TOKEN=", $u->createToken("ui-verify")->plainTextToken, PHP_EOL;
            '
