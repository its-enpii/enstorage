name: Verify Thumbnails

# Ambil thumbnail nyata sebagai base64 supaya orkestrator bisa memvalidasi piksel.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 15m
          script: |
            set -uo pipefail
            cd //home/enpii/studio/enstorage
            COMPOSE="docker compose -f docker-compose.yml"
            $COMPOSE exec -T app php artisan tinker --execute='
              $f = App\Models\File::with("thumbnail")->where("mime_type","like","video/%")->whereHas("thumbnail")->first();
              $p = storage_path("app/".$f->thumbnail->path);
              echo "NAME=", $f->name, PHP_EOL;
              echo "B64START", PHP_EOL;
              echo chunk_split(base64_encode(file_get_contents($p)), 200, PHP_EOL);
              echo "B64END", PHP_EOL;
            '
