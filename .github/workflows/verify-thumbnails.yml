name: Verify Thumbnails

# Verifikasi sekali pakai: 7 thumbnail video benar-benar berisi gambar valid.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 15m
          script: |
            set -uo pipefail
            cd //home/enpii/studio/enstorage
            COMPOSE="docker compose -f docker-compose.yml"
            $COMPOSE exec -T app php artisan tinker --execute='
              $rows = DB::table("thumbnails as t")
                ->join("files as f", "f.id", "=", "t.file_id")
                ->where("f.mime_type", "like", "video/%")
                ->select("f.name", "t.path", "t.width", "t.height", "t.size")
                ->get();
              echo "thumb_video_rows=", $rows->count(), PHP_EOL;
              $okCount = 0; $badCount = 0;
              foreach ($rows as $r) {
                $cands = [
                  \Illuminate\Support\Facades\Storage::disk("local")->path($r->path),
                  storage_path("app/".$r->path),
                  storage_path("app/public/".$r->path),
                ];
                $hit = null;
                foreach ($cands as $c) { if (is_file($c) && filesize($c) > 0) { $hit = $c; break; } }
                if ($hit) {
                  $dim = @getimagesize($hit) ?: [0,0];
                  $mime = $dim["mime"] ?? "?";
                  echo "  OK  ", $r->name, " bytes=", filesize($hit), " dim=", $dim[0], "x", $dim[1], " mime=", $mime, PHP_EOL;
                  $okCount++;
                } else {
                  echo "  BAD ", $r->name, " (no non-empty file at any root)", PHP_EOL;
                  $badCount++;
                }
              }
              echo "SUMMARY ok=", $okCount, " bad=", $badCount, PHP_EOL;
            '
