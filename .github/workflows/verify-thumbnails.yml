name: Verify Thumbnails

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 15m
          script: |
            cd //home/enpii/studio/enstorage
            C="docker compose -f docker-compose.yml"
            $C exec -T app php artisan tinker --execute='
              $t = App\Models\File::where("mime_type","like","text/%")->orWhere("mime_type","like","%json%")->orWhere("mime_type","like","%pdf%")->orWhere("mime_type","like","%zip%");
              $all = $t->where("upload_status","done")->get();
              $withSnip = $all->filter(fn($f) => isset($f->metadata["snippet"]));
              $noSnip = $all->reject(fn($f) => isset($f->metadata["snippet"]));
              echo "docs_done=", $all->count(), " with_snippet=", $withSnip->count(), " no_snippet=", $noSnip->count(), PHP_EOL;
              foreach ($noSnip->take(12) as $f) {
                echo "  NOSNIP ", $f->name, " | ", $f->mime_type, " | size=", $f->size,
                     " | meta_keys=", implode(",", array_keys((array) $f->metadata)), PHP_EOL;
              }
            '
            echo "── log backfill (warning/error) ──"
            $C logs --no-log-prefix --tail=3000 app 2>&1 | grep -iE "backfill|thumbnails:backfill|gagal re-ekstrak|ekstrak" | tail -12 || echo "NO_LOG"
