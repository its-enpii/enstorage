name: Verify Thumbnails

# Verifikasi sekali pakai: 7 thumbnail video benar-benar berisi gambar valid.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 15m
          script: |
            set -uo pipefail
            cd //home/enpii/studio/enstorage
            COMPOSE="docker compose -f docker-compose.yml"
            $COMPOSE exec -T app php artisan tinker --execute='
              $rows = DB::table("thumbnails as t")
                ->join("files as f", "f.id", "=", "t.file_id")
                ->where("f.mime_type", "like", "video/%")
                ->select("f.name", "t.path", "t.width", "t.height", "t.size")
                ->limit(3)->get();
              foreach ($rows as $r) {
                echo "NAME=", $r->name, PHP_EOL;
                echo "  db_path=", $r->path, " db_w=", $r->width, " db_h=", $r->height, " db_size=", $r->size, PHP_EOL;
              }
              echo "--- disk roots ---", PHP_EOL;
              echo "local_root=", \Illuminate\Support\Facades\Storage::disk("local")->path(""), PHP_EOL;
              echo "public_root=", \Illuminate\Support\Facades\Storage::disk("public")->path(""), PHP_EOL;
            '
            echo "--- physical files (find thumbnails) ---"
            $COMPOSE exec -T app sh -lc 'find /var/www/html/storage -type f -newermt "-2 hours" \( -name "*.webp" -o -name "*.jpg" \) 2>/dev/null | head -20'
            echo "--- sizes of newest ---"
            $COMPOSE exec -T app sh -lc 'find /var/www/html/storage -type f -newermt "-2 hours" \( -name "*.webp" -o -name "*.jpg" \) -exec ls -l {} \; 2>/dev/null | head -20'
