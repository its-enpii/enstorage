name: Verify Thumbnails

# Verifikasi produksi: relasi thumbnail + endpoint HTTP nyata (in-process kernel).
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 15m
          script: |
            set -uo pipefail
            cd //home/enpii/studio/enstorage
            COMPOSE="docker compose -f docker-compose.yml"
            $COMPOSE exec -T app php artisan tinker --execute='
              $vids = App\Models\File::with("thumbnail")->where("mime_type","like","video/%")->get();
              $ok = 0; $bad = 0;
              foreach ($vids as $f) {
                $has = $f->thumbnail !== null;
                echo ($has ? "OK  " : "BAD "), $f->name, " thumbnail_relation=", (int)$has, PHP_EOL;
                $has ? $ok++ : $bad++;
              }
              echo "SUMMARY_VIDEO ok=", $ok, " bad=", $bad, PHP_EOL;

              $docs = App\Models\File::whereNotNull("metadata")->get()
                ->filter(fn ($f) => isset($f->metadata["snippet"]));
              echo "DOCS_SNIPPET=", $docs->count(), PHP_EOL;
              foreach ($docs->take(3) as $d) {
                echo "  DOC ", $d->name, " snippet_len=", strlen($d->metadata["snippet"]), PHP_EOL;
              }

              // Endpoint nyata lewat kernel HTTP Laravel (tanpa curl/port).
              $f = App\Models\File::with("thumbnail")->where("mime_type","like","video/%")
                    ->whereHas("thumbnail")->first();
              if ($f) {
                $res = App\Http\Resources\FileResource::make($f);
                $arr = $res->resolve();
                echo "RESOURCE has_thumbnail=", (int)$arr["has_thumbnail"], " name=", $arr["name"], PHP_EOL;
              }
            '
