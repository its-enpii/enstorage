name: Verify Thumbnails

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 15m
          script: |
            cd //home/enpii/studio/enstorage
            docker compose -f docker-compose.yml exec -T app php artisan tinker --execute='$f=App\Models\File::with("thumbnail")->where("mime_type","like","video/%")->whereHas("thumbnail")->first(); $p=storage_path("app/".$f->thumbnail->path); echo "XXNAMEXX", $f->name, PHP_EOL; echo "XXB64XX", base64_encode(file_get_contents($p)), "XXENDXX", PHP_EOL;'
