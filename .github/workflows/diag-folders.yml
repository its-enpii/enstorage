name: Diag Folders
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 20m
          script: |
            cd //home/enpii/studio/enstorage
            C="docker compose -f docker-compose.yml"
            $C exec -T app php artisan tinker --execute='
              $fid = DB::table("files")->whereNotNull("folder_id")->select("folder_id", DB::raw("count(*) as n"))
                ->groupBy("folder_id")->orderByDesc("n")->value("folder_id");
              $name = DB::table("folders")->where("id", $fid)->value("name");
              $files = DB::table("files")->where("folder_id", $fid)->count();
              $subs  = DB::table("folders")->where("parent_id", $fid)->count();
              echo "FOLDER=", $name, " files=", $files, " subfolders=", $subs, PHP_EOL;
              echo "per_page=50 -> last_page=", (int) ceil($files / 50), " halaman", PHP_EOL;
              echo "hasMoreFolders=", ($subs > 0 ? "true" : "FALSE"), " hasMoreFiles=", ($files > 50 ? "TRUE" : "false"), PHP_EOL;
              echo "=> sentinel enabled (tab=all) = hasMoreFolders = ", ($subs > 0 ? "true" : "FALSE"), PHP_EOL;
              echo "=> file yang tampil sampai user scroll habis = ", ($subs > 0 ? "50+" : "50 SAJA dari ".$files), PHP_EOL;
            '
