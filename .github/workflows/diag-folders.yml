name: Diag Folders
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 25m
          script: |
            cd //home/enpii/studio/enstorage
            C="docker compose -f docker-compose.yml"
            $C exec -T app php artisan tinker --execute='
              echo "=== 10 folder dengan file terbanyak: total vs done vs status lain ===", PHP_EOL;
              $rows = DB::table("files")->select("folder_id", DB::raw("count(*) as total"))
                ->whereNotNull("folder_id")->groupBy("folder_id")->orderByDesc("total")->limit(10)->get();
              foreach ($rows as $r) {
                $name = DB::table("folders")->where("id", $r->folder_id)->value("name");
                $done = DB::table("files")->where("folder_id", $r->folder_id)->where("upload_status","done")->count();
                $byStatus = DB::table("files")->where("folder_id", $r->folder_id)
                  ->select("upload_status", DB::raw("count(*) as n"))->groupBy("upload_status")->pluck("n","upload_status")->all();
                $s = []; foreach ($byStatus as $k=>$v) { $s[] = $k."=".$v; }
                echo "  ", $r->folder_id, " | ", $name, " | total=", $r->total, " done=", $done, " [", implode(",", $s), "]", PHP_EOL;
              }
              echo "=== ringkasan status seluruh file ===", PHP_EOL;
              foreach (DB::table("files")->select("upload_status", DB::raw("count(*) as n"))->groupBy("upload_status")->get() as $r) {
                echo "  ", $r->upload_status, "=", $r->n, PHP_EOL;
              }
              echo "=== file dengan folder_id menunjuk folder yang TIDAK ADA (yatim) ===", PHP_EOL;
              $orphan = DB::table("files as f")->leftJoin("folders as d","d.id","=","f.folder_id")
                ->whereNotNull("f.folder_id")->whereNull("d.id")->count();
              echo "  orphan_files=", $orphan, PHP_EOL;
              echo "=== folder yatim (parent hilang) ===", PHP_EOL;
              $of = DB::table("folders as c")->leftJoin("folders as p","p.id","=","c.parent_id")
                ->whereNotNull("c.parent_id")->whereNull("p.id")->count();
              echo "  orphan_folders=", $of, PHP_EOL;
            '
