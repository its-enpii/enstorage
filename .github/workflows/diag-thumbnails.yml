name: Diag Thumbnails

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -uo pipefail
            cd //home/enpii/studio/enstorage
            C="docker compose -f docker-compose.yml"
            echo "── failed_jobs ──"
            $C exec -T app php artisan tinker --execute='
              echo "failed_jobs=", DB::table("failed_jobs")->count(), PHP_EOL;
              foreach (DB::table("failed_jobs")->orderByDesc("failed_at")->limit(3)->get() as $j) {
                echo "--- ", $j->failed_at, " | ", substr((string) $j->payload, 0, 90), PHP_EOL;
                echo "    EXC: ", substr((string) $j->exception, 0, 400), PHP_EOL;
              }
            '
            echo "── antrean default ──"
            $C exec -T app php artisan tinker --execute='
              echo "queue_size=", \Illuminate\Support\Facades\Queue::size("default"), PHP_EOL;
            '
            echo "── 5 file sisa: kind + driver + size ──"
            $C exec -T app php artisan tinker --execute='
              $i = 0;
              App\Models\File::where("upload_status","done")->with("thumbnail")->chunkById(500, function ($files) use (&$i) {
                foreach ($files as $f) {
                  if ($i >= 5) { return; }
                  $t = $f->thumbnail;
                  if ($t && App\Services\ThumbnailGenerator::exists((string) $t->path)) { continue; }
                  $k = App\Services\ThumbnailGenerator::mediaKind($f);
                  if ($k === null) { continue; }
                  echo "  ", $f->name, " | kind=", $k, " | driver=", $f->storage_driver,
                       " | size=", $f->size, " | mime=", $f->mime_type,
                       " | path=", $f->storage_path, PHP_EOL;
                  $i++;
                }
              });
            '
            echo "── log worker (thumbnail) ──"
            $C logs --no-log-prefix --tail=4000 worker 2>&1 | grep -iE "ThumbnailGenerator gagal|ffmpeg|ekstraksi frame|downloadFromDrive gagal" | tail -10 || echo NO_ERROR
