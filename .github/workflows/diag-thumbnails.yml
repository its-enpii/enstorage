name: Diag Thumbnails

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -uo pipefail
            cd //home/enpii/studio/enstorage
            C="docker compose -f docker-compose.yml"
            echo "── file fisik vs DB ──"
            $C exec -T app sh -lc 'ls -1 /var/www/html/storage/app/thumbnails 2>/dev/null | wc -l; du -sh /var/www/html/storage/app/thumbnails 2>/dev/null'
            $C exec -T app php artisan tinker --execute='
              $rows = DB::table("thumbnails")->get();
              $ok = 0; $gone = 0; $recent = 0;
              foreach ($rows as $r) {
                if (is_file(storage_path("app/" . $r->path))) { $ok++; }
                else { $gone++; if (strtotime((string) $r->generated_at) > strtotime("-3 days")) { $recent++; } }
              }
              echo "rows=", $rows->count(), " file_ok=", $ok, " file_gone=", $gone, " gone_recent=", $recent, PHP_EOL;
              $oldestGone = null; $newestGone = null;
              foreach ($rows as $r) {
                if (is_file(storage_path("app/" . $r->path))) { continue; }
                $g = strtotime((string) $r->generated_at);
                if ($g <= 0) { continue; }
                if ($oldestGone === null || $g < $oldestGone) { $oldestGone = $g; }
                if ($newestGone === null || $g > $newestGone) { $newestGone = $g; }
              }
              echo "gone_oldest=", $oldestGone ? date("Y-m-d", $oldestGone) : "-",
                   " gone_newest=", $newestGone ? date("Y-m-d", $newestGone) : "-", PHP_EOL;
            '
            echo "── kandidat thumbnail sebenarnya (row hilang / file hilang) ──"
            $C exec -T app php artisan tinker --execute='
              $cats = [];
              $total = 0;
              App\Models\File::where("upload_status","done")->with("thumbnail")->chunkById(500, function ($files) use (&$cats, &$total) {
                foreach ($files as $f) {
                  $t = $f->thumbnail;
                  if ($t && is_file(storage_path("app/" . $t->path))) { continue; }
                  $m = strtolower((string) $f->mime_type);
                  $ext = strtolower(pathinfo((string) $f->name, PATHINFO_EXTENSION));
                  if (str_starts_with($m, "image/") || in_array($ext, ["png","jpg","jpeg","webp","gif","avif"], true)) { $k = "image"; }
                  elseif (str_starts_with($m, "video/") || in_array($ext, ["mp4","webm","mkv","mov","avi"], true)) { $k = "video"; }
                  elseif (str_starts_with($m, "audio/")) { $k = "audio"; }
                  else { $k = "doc"; }
                  $cats[$k] = ($cats[$k] ?? 0) + 1;
                  $total++;
                }
              });
              echo "need_total=", $total, PHP_EOL;
              arsort($cats);
              foreach ($cats as $k => $n) { echo "  need_", $k, "=", $n, PHP_EOL; }
            '
            echo "── umur file image/video yang butuh thumb ──"
            $C exec -T app php artisan tinker --execute='
              $q = App\Models\File::where("upload_status","done")->with("thumbnail")
                    ->where(function ($x) { $x->where("mime_type","like","image/%")->orWhere("mime_type","like","video/%"); });
              $byMonth = [];
              $q->chunkById(500, function ($files) use (&$byMonth) {
                foreach ($files as $f) {
                  $t = $f->thumbnail;
                  if ($t && is_file(storage_path("app/" . $t->path))) { continue; }
                  $k = $f->created_at ? $f->created_at->format("Y-m") : "?";
                  $byMonth[$k] = ($byMonth[$k] ?? 0) + 1;
                }
              });
              ksort($byMonth);
              foreach ($byMonth as $k => $n) { echo "  month=", $k, " need=", $n, PHP_EOL; }
            '
