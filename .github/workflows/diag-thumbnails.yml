name: Diag Thumbnails

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -uo pipefail
            cd //home/enpii/studio/enstorage
            C="docker compose -f docker-compose.yml"
            echo -n "app/thumbnails        : "; $C exec -T app sh -lc 'ls -1 /var/www/html/storage/app/thumbnails 2>/dev/null | wc -l'
            echo -n "app/private/thumbnails: "; $C exec -T app sh -lc 'ls -1 /var/www/html/storage/app/private/thumbnails 2>/dev/null | wc -l'
            echo "── 3 nama di private ──"
            $C exec -T app sh -lc 'ls /var/www/html/storage/app/private/thumbnails 2>/dev/null | head -3'
            echo "── ukuran private ──"
            $C exec -T app sh -lc 'du -sh /var/www/html/storage/app/private/thumbnails 2>/dev/null'
            echo "── generator: lokasi tulis ──"
            $C exec -T app sh -lc 'grep -n "disk(\x27local\x27)->path\|\$relative" /var/www/html/app/Services/ThumbnailGenerator.php | head -6'
            echo "── endpoint: lokasi baca ──"
            $C exec -T app sh -lc 'grep -rn "thumbnail->path" /var/www/html/app/Http/Controllers/Api/FileController.php | head -4'
