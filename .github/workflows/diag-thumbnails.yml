name: Diag Thumbnails

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -uo pipefail
            cd //home/enpii/studio/enstorage
            C="docker compose -f docker-compose.yml"
            echo "── mounts app ──"
            docker inspect enstorage-app --format '{{range .Mounts}}{{.Type}} {{.Name}} {{.Source}} -> {{.Destination}}{{"\n"}}{{end}}' | grep -E "storage|bootstrap"
            echo "── mounts worker ──"
            docker inspect enstorage-worker --format '{{range .Mounts}}{{.Type}} {{.Name}} {{.Source}} -> {{.Destination}}{{"\n"}}{{end}}' | grep -E "storage|bootstrap"
            echo "── jumlah file thumbnails per container ──"
            echo -n "app    : "; $C exec -T app sh -lc 'ls -1 /var/www/html/storage/app/thumbnails 2>/dev/null | wc -l'
            echo -n "worker : "; $C exec -T worker sh -lc 'ls -1 /var/www/html/storage/app/thumbnails 2>/dev/null | wc -l'
            echo "── inode dir (harus sama kalau volume sama) ──"
            echo -n "app    : "; $C exec -T app sh -lc 'stat -c "%d:%i" /var/www/html/storage/app/thumbnails 2>/dev/null'
            echo -n "worker : "; $C exec -T worker sh -lc 'stat -c "%d:%i" /var/www/html/storage/app/thumbnails 2>/dev/null'
            echo "── 5 file terbaru di worker ──"
            $C exec -T worker sh -lc 'ls -t /var/www/html/storage/app/thumbnails 2>/dev/null | head -5'
            echo "── 5 file terbaru di app ──"
            $C exec -T app sh -lc 'ls -t /var/www/html/storage/app/thumbnails 2>/dev/null | head -5'
