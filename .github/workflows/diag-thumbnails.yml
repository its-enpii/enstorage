name: Diag Thumbnails

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -uo pipefail
            cd //home/enpii/studio/enstorage
            C="docker compose -f docker-compose.yml"
            echo -n "file app/private/thumbnails: "; $C exec -T app sh -lc 'ls -1 /var/www/html/storage/app/private/thumbnails 2>/dev/null | wc -l'
            echo -n "file app/thumbnails(legacy): "; $C exec -T app sh -lc 'ls -1 /var/www/html/storage/app/thumbnails 2>/dev/null | wc -l'
            $C exec -T app php artisan tinker --execute='
              $rows = DB::table("thumbnails")->get();
              $ok = 0; $bad = 0;
              foreach ($rows as $r) {
                if (App\Services\ThumbnailGenerator::exists((string) $r->path)) { $ok++; } else { $bad++; }
              }
              echo "rows=", $rows->count(), " resolvable=", $ok, " missing=", $bad, PHP_EOL;

              $need = 0; $cats = [];
              App\Models\File::where("upload_status","done")->with("thumbnail")->chunkById(500, function ($files) use (&$need, &$cats) {
                foreach ($files as $f) {
                  $t = $f->thumbnail;
                  if ($t && App\Services\ThumbnailGenerator::exists((string) $t->path)) { continue; }
                  $k = App\Services\ThumbnailGenerator::mediaKind($f);
                  if ($k === null) { continue; }
                  $need++; $cats[$k] = ($cats[$k] ?? 0) + 1;
                }
              });
              echo "media_without_thumb=", $need, PHP_EOL;
              foreach ($cats as $k => $n) { echo "  ", $k, "=", $n, PHP_EOL; }
            '
            echo "── antrean sisa ──"
            $C exec -T redis sh -lc 'redis-cli --no-auth-warning -a "$REDIS_PASSWORD" LLEN queues:default' 2>/dev/null || echo unavailable
            echo "── error worker terakhir ──"
            $C logs --no-log-prefix --tail=2000 worker 2>&1 | grep -iE "ThumbnailGenerator gagal|ffmpeg tidak tersedia|ekstraksi frame" | tail -6 || echo NO_ERROR
