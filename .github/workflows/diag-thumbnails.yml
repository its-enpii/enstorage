name: Diag Thumbnails
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 20m
          script: |
            cd //home/enpii/studio/enstorage
            C="docker compose -f docker-compose.yml"
            echo "== 3 failed_jobs terbaru =="
            $C exec -T app php artisan tinker --execute='
              foreach (DB::table("failed_jobs")->orderByDesc("failed_at")->limit(3)->get() as $j) {
                echo "AT ", $j->failed_at, PHP_EOL;
                echo "EXC ", substr(str_replace(chr(10), " | ", (string) $j->exception), 0, 500), PHP_EOL, PHP_EOL;
              }
            '
            echo "== log worker thumbnail (100 baris terakhir) =="
            $C logs --no-log-prefix --tail=3000 worker 2>&1 | grep -iE "ThumbnailGenerator|thumb|ffmpeg" | tail -12 || echo NONE
