name: Diag Thumbnails

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -uo pipefail
            cd //home/enpii/studio/enstorage
            C="docker compose -f docker-compose.yml"
            echo "── file fisik di storage/app/thumbnails ──"
            $C exec -T app sh -lc 'ls /var/www/html/storage/app/thumbnails 2>/dev/null | wc -l; ls /var/www/html/storage/app/thumbnails 2>/dev/null | head -3'
            echo "── file fisik di storage/app/private/thumbnails ──"
            $C exec -T app sh -lc 'ls /var/www/html/storage/app/private/thumbnails 2>/dev/null | wc -l'
            echo "── lokasi lain (find) ──"
            $C exec -T app sh -lc 'find /var/www/html/storage -type d -name thumbnails 2>/dev/null'
            echo "── hitung DB vs disk per base ──"
            $C exec -T app php artisan tinker --execute='
              $paths = DB::table("thumbnails")->pluck("path")->all();
              $bases = [
                "app"          => storage_path("app"),
                "app/private"  => storage_path("app/private"),
                "app/public"   => storage_path("app/public"),
              ];
              echo "db_rows=", count($paths), PHP_EOL;
              foreach ($bases as $label => $base) {
                $hit = 0;
                foreach ($paths as $p) { if (is_file($base."/".$p)) { $hit++; } }
                echo "  base=", $label, " exists=", $hit, PHP_EOL;
              }
              echo "  sample_db_path=", $paths[0] ?? "(none)", PHP_EOL;
              $firstFound = null;
              foreach ($paths as $p) { if (is_file(storage_path("app/".$p))) { $firstFound = $p; break; } }
              echo "  sample_found_path=", $firstFound ?? "(none)", PHP_EOL;
            '
            echo "── apakah file contoh benar-benar ada (ls) ──"
            $C exec -T app sh -lc 'ls -l /var/www/html/storage/app/thumbnails/ 2>/dev/null | head -5'
            echo "── volume mount ──"
            docker inspect enstorage-app --format '{{range .Mounts}}{{.Source}} -> {{.Destination}}{{"\n"}}{{end}}' | grep -i stor
