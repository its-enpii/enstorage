name: Diag Thumbnails

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -uo pipefail
            cd //home/enpii/studio/enstorage
            C="docker compose -f docker-compose.yml"
            $C exec -T app php artisan tinker --execute='
              $miss = App\Models\File::where("upload_status","done")->whereDoesntHave("thumbnail");
              echo "=== octet-stream tanpa thumb: sebaran ekstensi ===", PHP_EOL;
              $oct = (clone $miss)->where("mime_type","like","%octet-stream%")->get();
              $byExt = [];
              foreach ($oct as $f) {
                $e = strtolower(pathinfo($f->name, PATHINFO_EXTENSION)) ?: "(none)";
                $byExt[$e] = ($byExt[$e] ?? 0) + 1;
              }
              arsort($byExt);
              foreach ($byExt as $e => $n) { echo "  ext=", $e, " n=", $n, PHP_EOL; }
              echo "  oct_total=", $oct->count(), PHP_EOL;

              echo "=== image tanpa thumb: sebaran ekstensi + umur ===", PHP_EOL;
              $img = (clone $miss)->where("mime_type","like","image/%")->get();
              $ie = [];
              foreach ($img as $f) { $e = strtolower(pathinfo($f->name, PATHINFO_EXTENSION)) ?: "(none)"; $ie[$e] = ($ie[$e] ?? 0) + 1; }
              arsort($ie);
              foreach ($ie as $e => $n) { echo "  img_ext=", $e, " n=", $n, PHP_EOL; }
              echo "  image_total=", $img->count(), PHP_EOL;
              echo "  image_oldest=", $img->min("created_at"), " newest=", $img->max("created_at"), PHP_EOL;

              echo "=== apakah ada thumb yang filenya hilang dari disk? ===", PHP_EOL;
              $rows = DB::table("thumbnails")->select("path")->limit(3000)->get();
              $gone = 0;
              foreach ($rows as $r) { if (! is_file(storage_path("app/".$r->path))) { $gone++; } }
              echo "  thumb_rows=", $rows->count(), " file_missing=", $gone, PHP_EOL;
            '
