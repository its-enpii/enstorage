name: Diag Paging
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 15m
          script: |
            cd //home/enpii/studio/enstorage
            C="docker compose -f docker-compose.yml"
            echo "== versi kode di host =="
            git log --oneline -1
            echo "== penanda resolvePaging di sumber host =="
            grep -c "resolvePaging" web/src/lib/filesPaging.mjs 2>/dev/null || echo "NO_HELPER"
            grep -c "resetPages" web/src/lib/filesStore.tsx 2>/dev/null || echo "NO_RESET"
            echo "== penanda di bundel produksi (container web) =="
            $C exec -T web sh -lc 'grep -rl "resetPages\|loadFolders,\s*loadFiles" /app/.next 2>/dev/null | head -3' || echo "NO_MARKER_IN_BUNDLE"
            $C exec -T web sh -lc 'ls -la /app/.next/BUILD_ID 2>/dev/null; cat /app/.next/BUILD_ID 2>/dev/null' || echo "NO_BUILD_ID"
            echo "== mtime bundel vs sumber =="
            $C exec -T web sh -lc 'stat -c "%y %n" /app/.next/BUILD_ID 2>/dev/null'
            stat -c "%y %n" web/src/lib/filesStore.tsx
